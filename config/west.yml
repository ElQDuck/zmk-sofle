manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
      # Additional modules containing boards/shields/custom code can be listed here as well.
      # See:
      # - https://zmk.dev/docs/features/modules
      # - https://docs.zephyrproject.org/3.5.0/develop/west/manifest.html#projects
    - name: ElQDuck
      url-base: https://github.com/ElQDuck
  projects:
    - name: zmk
      remote: zmkfirmware
      # Pinned to the v0.3 release branch (Zephyr 3.5, LVGL 8).
      # `main` is Zephyr 4.x now: it drops the Hardware Model v1 board layout this
      # repo uses under boards/arm/, and LVGL 9 removes the canvas API the
      # nice-view-mod widgets are written against. See the README TODO.
      revision: v0.3
      import: app/west.yml
    # Bongocat (from https://github.com/dsifry) and my house coat of arms
    - name: nice-view-mod
      remote: ElQDuck
      revision: main
  self:
    path: config
