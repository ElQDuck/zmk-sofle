name: Build ZMK firmware
on:
  workflow_dispatch: # Allows manual triggering of the workflow
  push:
    branches:
      - main # Only triggers on pushes to the main branch
    paths-ignore:
      - "keymap-drawer/**"

jobs:
  build:
    # Must match the ZMK revision in config/west.yml. The @main workflow targets
    # Zephyr 4.x and fails this Hardware Model v1 board in its ZMK-compat check.
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

